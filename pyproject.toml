[project]
name = "support-drafts"
version = "0.1.0"
description = "Helpdesk webhook -> LLM draft replies from a KB -> operator approval -> reply back"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.1",
    "anthropic==2.6.0",
    "asyncpg==0.32.0",
    "fastapi==0.162.0",
    "pydantic-settings==2.16.2",
    "sqlalchemy[asyncio]==2.1.8",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.17.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
